<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>materia systems</title>
  <meta name="description" content="one dev. i automate the boring stuff so your business runs while you don't.">
  <style>
    :root {
      --bg: #08090c;
      --fg: #f4f5f7;
      --muted: #71757f;
      --accent: #c6f24e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 24px;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(60% 50% at 78% 8%, rgba(198,242,78,0.10) 0%, rgba(198,242,78,0) 60%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: "";
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(70% 60% at 70% 10%, #000 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(70% 60% at 70% 10%, #000 0%, transparent 75%);
      pointer-events: none; z-index: 0;
    }
    .top, .mid, .bottom { position: relative; z-index: 1; }
    .top {
      display: flex; align-items: center; gap: 9px;
      font-size: 14px; color: var(--muted); letter-spacing: 0.01em; font-weight: 500;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 0 0 var(--accent);
      animation: pulse 2.2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(198,242,78,0.5); }
      70% { box-shadow: 0 0 0 9px rgba(198,242,78,0); }
      100% { box-shadow: 0 0 0 0 rgba(198,242,78,0); }
    }
    .mid {
      display: flex; flex-direction: column; justify-content: center; flex: 1;
      max-width: 720px;
    }
    h1 {
      font-size: clamp(38px, 11vw, 84px);
      line-height: 0.98;
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    h1 .g { color: var(--accent); }
    .tag {
      margin-top: 22px;
      font-size: clamp(16px, 2.6vw, 20px);
      line-height: 1.5;
      color: var(--muted);
      max-width: 500px;
    }
    .tag b { color: var(--fg); font-weight: 500; }
    .bottom {
      display: flex; align-items: flex-end; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
    }
    .cta {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: clamp(16px, 3vw, 20px);
      font-weight: 600;
      color: var(--bg);
      background: var(--accent);
      padding: 13px 24px;
      border-radius: 100px;
      text-decoration: none;
      transition: transform .14s ease, box-shadow .14s ease;
    }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -8px rgba(198,242,78,0.5); }
    .sig { font-size: 13px; color: var(--muted); text-align: right; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="top"><span class="dot"></span> materia systems</div>

  <div class="mid">
    <h1>i automate<br>the <span class="g">boring stuff.</span></h1>
    <p class="tag">the reports, the data, the copy-paste grind &mdash; <b>i build software that just does it. while you chill with your coffee.</b></p>
  </div>

  <div class="bottom">
    <a class="cta" href="https://wa.me/60172293696?text=Hi%21%20Reaching%20out%20to%20see%20if%20you%20can%20make%20my%20business%20easier%20with%20some%20automations%21">whatsapp me, let&rsquo;s cook &rarr;</a>
    <div class="sig">one dev &middot; bank dev by day &middot; made in 🇲🇾</div>
  </div>
</body>
</html>
